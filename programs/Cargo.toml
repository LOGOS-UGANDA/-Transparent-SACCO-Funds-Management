[workspace]
members = [
    "sacco_ledger/core",
    "sacco_ledger",
    "sacco_ledger/idl",
    "sacco_ledger/methods",
    "sacco_ledger/client",
]
exclude = [
    "sacco_ledger/methods/guest",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1", package = "lee_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
borsh = { version = "1.5.7", features = ["derive"] }
risc0-zkvm = { version = "=3.0.5", default-features = false }
sacco_ledger_core = { path = "sacco_ledger/core" }
sacco_ledger_program = { path = "sacco_ledger" }

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
