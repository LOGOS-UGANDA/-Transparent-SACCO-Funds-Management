[workspace]
members = [
    "sacco_ledger/core",
    "sacco_ledger",
    "sacco_ledger/methods",
]
exclude = [
    "sacco_ledger/methods/guest",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.5-rc2", features = ["host"], package = "lee_core" }
serde = { version = "1.0", features = ["derive"] }
borsh = { version = "1.5", features = ["derive"] }
risc0-zkvm = { version = "=3.0.5" }
token_core = { git = "https://github.com/logos-blockchain/lez-programs.git", package = "token_core" }
sacco_ledger_core = { path = "sacco_ledger/core" }
sacco_ledger_program = { path = "sacco_ledger" }

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
