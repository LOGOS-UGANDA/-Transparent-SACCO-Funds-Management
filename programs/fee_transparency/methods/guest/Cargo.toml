[package]
name = "fee_transparency-guest"
version = "0.1.0"
edition = "2021"

[workspace]

[profile.release]
debug = 0
strip = "symbols"

[lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"

[[bin]]
name = "fee_transparency"
path = "src/bin/fee_transparency.rs"

[dependencies]
spel-framework = { git = "https://github.com/logos-co/spel.git", tag = "v0.6.0", package = "spel-framework" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0", package = "lee_core" }
risc0-zkvm = { version = "=3.0.5", default-features = false }
ruint = { version = "=1.17.0", default-features = false }
fee_transparency_core = { path = "../../core" }
fee_transparency_program = { path = "../..", package = "fee_transparency_program" }
token_core = { git = "https://github.com/logos-blockchain/lez-programs.git", package = "token_core" }
serde = { version = "1.0", features = ["derive"] }
borsh = "1.5"
