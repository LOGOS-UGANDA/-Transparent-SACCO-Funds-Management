[package]
name = "sacco_ledger_local_client"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
anyhow = "1"
borsh = "1.5.7"
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1", package = "lee_core" }
sacco_ledger_core = { path = "../core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
